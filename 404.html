<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="This page could not be found.">
<meta property="og:title" content="Tiny Terminal">
<meta property="og:description" content="Run a tiny airport. Build a small airport into a busy hub, one passenger at a time.">

<meta name="twitter:description" content="Run a tiny airport. Build a small airport into a busy hub, one passenger at a time.">

<!-- Inter is self-hosted (assets/fonts, SIL OFL 1.1). The only third-party request is the GoatCounter visit counter, disclosed in privacy.html. -->
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
  :root{
    /* Tiny Terminal tokens (ubersoft-company games/idle-airport/style/tokens.js) */
    --page:#f4efe6; --card:#fffdf9; --card-locked:#fbf8f2; --hairline:#e6e0d4; --chip:#efe9de;
    --ink:#2b2f36; --ink-soft:#6b7280; --ink-faint:#9b9489;
    --teal:#1f7f86; --teal-deep:#196a70; --teal-tint:#e3f0ef;
    --gold:#d9a441; --gold-soft:#f3d381; --coral:#e07a5f; --mint:#7fd1b0;
    --apron:#8a9095; --taxi-yellow:#e8c24a;
    /* site roles: content on paper, bands on cream */
    --bg:var(--card); --bg-soft:var(--page); --line:var(--hairline);
    --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --r:12px; --r-btn:8px; --maxw:1120px;
    /* elevation: card, sheet, toast from tokens.js; shot, menu and lightbox derived from the sheet and ink colours */
    --elev-card:0 2px 4px rgba(60,50,30,.06); --elev-sheet:0 -6px 24px rgba(40,30,20,.12); --elev-toast:0 6px 16px rgba(30,30,30,.18);
    --elev-shot:0 16px 44px -22px rgba(40,30,20,.45); --elev-menu:0 12px 24px -16px rgba(40,30,20,.25); --elev-lightbox:0 40px 90px -30px rgba(43,47,54,.6);
    /* text on teal buttons: the paper colour (6.19:1 on --teal-deep) */
    --on-teal:var(--card);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans); font-weight:400;
    line-height:1.6; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none}
  img{max-width:100%}
  :focus-visible{outline:3px solid var(--teal); outline-offset:2px; border-radius:4px}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px; width:100%}
  h1,h2,h3{font-family:var(--sans); font-weight:800; letter-spacing:-0.02em; line-height:1.1}
  .eyebrow{font-size:12px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal-deep)}
  .tiny{color:var(--teal)}

  /* nav */
  nav{position:sticky; top:0; z-index:50; background:rgba(255,253,249,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
  .nav-in{display:flex; align-items:center; justify-content:space-between; max-width:var(--maxw); margin:0 auto; padding:12px 24px; position:relative}
  .brand{display:inline-flex; align-items:center; gap:10px; min-height:44px; font-size:18px; font-weight:800; letter-spacing:-0.01em; color:var(--ink); white-space:nowrap}
  .brand img{width:32px; height:32px; border-radius:8px}
  .nav-r{display:flex; align-items:center; gap:26px}
  .nav-r a{font-size:14px; font-weight:500; color:var(--ink-soft); transition:.15s}
  .nav-r a:hover{color:var(--ink)}
  .nav-btn{background:var(--teal-deep); color:var(--on-teal) !important; padding:9px 18px; border-radius:var(--r-btn); font-weight:700; font-size:14px; transition:.15s}
  .nav-btn:hover{background:var(--ink)}
  /* Hamburger toggle: hidden on desktop, shown on mobile */
  .nav-toggle{display:none; flex-direction:column; justify-content:center; gap:5px; width:44px; height:44px; padding:0 9px; border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .nav-toggle span{display:block; height:2px; width:100%; background:var(--ink); border-radius:2px; transition:transform .2s ease, opacity .2s ease}
  .nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
  .nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  .app-icon{border-radius:22%; box-shadow:var(--elev-toast)}
  .pill{display:inline-block; padding:11px 20px; background:var(--teal-tint); color:var(--teal-deep); border-radius:999px; font-weight:700; font-size:15px}
  .trust-strip{display:flex; gap:10px 16px; justify-content:center; flex-wrap:wrap; margin-top:22px; font-size:13px; font-weight:500; color:var(--ink)}
  .trust-strip span{display:inline-flex; align-items:center; gap:7px}
  .trust-strip span::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--teal)}

  /* footer */
  footer{padding:54px 0 38px; border-top:1px solid var(--line); background:var(--bg)}
  .foot-grid{display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:32px}
  .foot-brand p{color:var(--ink-soft); font-size:14px; margin-top:14px; max-width:24em}
  .foot-col h4{font-size:12px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal-deep); margin-bottom:12px}
  .foot-col a{display:block; color:var(--ink-soft); font-size:14px; padding:11px 0; line-height:22px; transition:.15s}
  .foot-col a:hover{color:var(--ink)}
  .foot-legal{border-top:1px solid var(--line); margin-top:38px; padding-top:22px; font-size:13px; color:var(--ink-soft); line-height:1.7}
  .foot-legal a{color:var(--ink); text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:2px}
  .foot-legal a:hover{color:var(--teal-deep)}

  @media(max-width:860px){
    .foot-grid{grid-template-columns:1fr 1fr}
    .nav-toggle{display:flex}
    /* Links collapse into a dropdown panel toggled by the hamburger */
    .nav-r{position:absolute; top:100%; left:0; right:0; flex-direction:column; align-items:stretch; gap:0;
           background:var(--card); border-bottom:1px solid var(--line); box-shadow:var(--elev-menu);
           padding:6px 0; display:none}
    .nav-r.open{display:flex}
    .nav-r a{padding:13px 24px; font-size:16px}
    .nav-r a:not(.nav-btn):hover{background:var(--bg-soft)}
    /* No persistent Get-the-game button on mobile */
    .nav-btn{display:none}
  }
  @media(max-width:520px){ .foot-grid{grid-template-columns:1fr} .wrap,.nav-in{padding-left:16px; padding-right:16px} }

  body{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-soft); text-align:center; padding:24px}
  main{max-width:30em}
  .n{font-size:clamp(72px,14vw,128px); font-weight:800; letter-spacing:-0.04em; color:var(--teal-deep); line-height:1; margin:14px 0 10px}
  h1{font-size:clamp(26px,4vw,36px)}
  main p{color:var(--ink); margin:14px 0 26px; font-size:17px}
  .btn{display:inline-block; background:var(--teal-deep); color:var(--on-teal); padding:12px 22px; border-radius:var(--r-btn); font-weight:700}
  .btn:hover{background:var(--ink)}
</style>
</head>
<body>

  <main>
    <div class="eyebrow">Tiny Terminal</div>
    <div class="n">404</div>
    <h1>This gate doesn't exist.</h1>
    <p>The page you were looking for has pushed back, or never was. The terminal is still open.</p>
    <a class="btn" href="/">Back to the terminal</a>
  </main>
  <script data-goatcounter="https://tinyterminal.goatcounter.com/count"
          async src="https://gc.zgo.at/count.v4.js"
          crossorigin="anonymous"
          integrity="sha384-nRw6qfbWyJha9LhsOtSb2YJDyZdKvvCFh0fJYlkquSFjUxp9FVNugbfy8q1jdxI+"></script>
</body>
</html>
